name: E2E / ydb

on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true
    secrets:
      E2E_YC_SA_KEY:
        required: true
      E2E_YC_FOLDER_ID:
        required: true
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to test
        type: string
        default: staging

jobs:
  test-ydb:
    name: ydb
    runs-on: ubuntu-latest
    env:
      RUNDECK_URL: http://localhost:4440
      FOLDER_ID: ${{ secrets.E2E_YC_FOLDER_ID }}
      ZONE: ru-central1-a
      DB_NAME: ${{ github.event.repository.name }}-ydb-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v6

      - name: E2E setup
        uses: ./.github/actions/e2e-setup
        with:
          image_tag: ${{ inputs.image_tag }}
          sa_key: ${{ secrets.E2E_YC_SA_KEY }}
          folder_id: ${{ secrets.E2E_YC_FOLDER_ID }}
          resource_types: '{"ydb":{"enabled":true}}'
        id: setup

      - name: Create YDB database
        id: resource
        run: |
          SUBNET_ID=$(yc vpc subnet list --folder-id "$FOLDER_ID" --format json \
            | jq -r --arg zone "$ZONE" '[.[] | select(.zone_id==$zone)][0].id')
          NETWORK_ID=$(yc vpc subnet list --folder-id "$FOLDER_ID" --format json \
            | jq -r --arg zone "$ZONE" '[.[] | select(.zone_id==$zone)][0].network_id')
          echo "Using subnet: $SUBNET_ID, network: $NETWORK_ID"
          yc ydb database create "$DB_NAME" \
            --folder-id "$FOLDER_ID" \
            --dedicated \
            --network-id "$NETWORK_ID" \
            --subnet-id "$SUBNET_ID" \
            --resource-preset small-m8 \
            --storage type=ssd,groups=1 \
            --fixed-size 1 \
            --labels "for-test=true" \
            --async
          DB_ID=$(yc ydb database get --name "$DB_NAME" --folder-id "$FOLDER_ID" --format json | jq -r '.id')
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "Database ID: $DB_ID"

      - name: Wait for database RUNNING
        run: |
          source tests/e2e/yc.sh
          wait_running ydb "${{ steps.resource.outputs.db_id }}" 60 15

      - name: Wait for node in Rundeck
        env:
          RUNDECK_TOKEN: ${{ steps.setup.outputs.rundeck_token }}
        run: |
          uv run tests/e2e/rundeck.py wait-node \
            --project e2e \
            --resource-id "${{ steps.resource.outputs.db_id }}" \
            --timeout 180

      - name: Run stop job
        env:
          RUNDECK_TOKEN: ${{ steps.setup.outputs.rundeck_token }}
        run: |
          uv run tests/e2e/rundeck.py run-job \
            --project e2e \
            --group e2e/ydb \
            --name Stop \
            --resource-id "${{ steps.resource.outputs.db_id }}" \
            --timeout 600

      - name: Verify STOPPED in YC
        run: |
          source tests/e2e/yc.sh
          verify_status ydb "${{ steps.resource.outputs.db_id }}" STOPPED

      - name: Run start job
        env:
          RUNDECK_TOKEN: ${{ steps.setup.outputs.rundeck_token }}
        run: |
          uv run tests/e2e/rundeck.py run-job \
            --project e2e \
            --group e2e/ydb \
            --name Start \
            --resource-id "${{ steps.resource.outputs.db_id }}" \
            --timeout 600

      - name: Verify RUNNING in YC
        run: |
          source tests/e2e/yc.sh
          verify_status ydb "${{ steps.resource.outputs.db_id }}" RUNNING 40 15

      - name: Cleanup - delete database
        if: always()
        run: yc ydb database delete --id "${{ steps.resource.outputs.db_id }}" --async || true

      - name: Cleanup - verify database deleted
        if: always()
        run: |
          for i in $(seq 1 30); do
            if ! yc ydb database get --id "${{ steps.resource.outputs.db_id }}" --format json > /dev/null 2>&1; then
              echo "Database deleted"
              exit 0
            fi
            echo "[$i/30] still exists..."
            sleep 10
          done
          echo "ERROR: Database not deleted after 5 minutes"
          exit 1

      - name: Cleanup - stop Rundeck
        if: always()
        run: docker rm -f rundeck || true

      - name: Summary
        if: always()
        run: |
          echo "## E2E: ydb" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image tag   | \`${{ inputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Database    | \`$DB_NAME\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Database ID | \`${{ steps.resource.outputs.db_id }}\` |" >> "$GITHUB_STEP_SUMMARY"
